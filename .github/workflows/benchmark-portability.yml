name: Benchmark tooling portability

on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'scripts/benchmark*.py'
      - 'scripts/collect-benchmarks.py'
      - 'tests/test_benchmark_collector.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/benchmark-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test portable orchestration without a native Vestra build
        run: uv run --no-project --python 3.13 --with pytest --with psutil==7.2.2 --with Pillow==11.3.0 python -m pytest tests/test_benchmark_collector.py tests/test_benchmark_compare.py tests/test_moviepy_comparison.py -q
