name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust-format:
    name: Rust Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Check Rust formatting
        run: nix develop --command cargo fmt --all -- --check

  python-format:
    name: Python Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Check maintained Python format surface
        run: >-
          uvx --from 'ruff>=0.12,<0.13' ruff format --check
          python/vestra/sources/base.py python/vestra/sources/__init__.py

  rust-check:
    name: Rust Check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Rust and FFmpeg diagnostics
        run: |
          set -euo pipefail
          nix develop --command bash -euo pipefail -c '
            rustc --version
            cargo --version
            ffmpeg -version | head -1
            for library in libavcodec libavformat libavutil libswscale; do
              printf "%s=" "$library"
              pkg-config --modversion "$library"
            done
          '
      - name: Check workspace
        run: nix develop --command cargo check --workspace --all-features

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Run Clippy
        run: >-
          nix develop --command cargo clippy --workspace --all-targets
          --all-features -- -D warnings

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Rust and FFmpeg diagnostics
        run: |
          set -euo pipefail
          nix develop --command bash -euo pipefail -c '
            rustc --version
            ffmpeg -version | head -1
            pkg-config --modversion libavcodec libavformat libavutil libswscale
          '
      - name: Run workspace tests
        run: nix develop --command cargo test --workspace --all-features

  python-lint:
    name: Python Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Lint maintained Python package
        run: uvx --from 'ruff>=0.12,<0.13' ruff check python/vestra

  python-tests:
    name: Python Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Python diagnostics
        run: |
          python --version
          uv --version
      - name: Build the native extension in the project environment
        run: nix develop --command uv sync --locked --extra dev
      - name: Run Python tests and compile check
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest
          .venv/bin/python -m compileall -q python/vestra

  schema-contract:
    name: Schema Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install the locked test environment
        run: nix develop --command uv sync --locked --extra test
      - name: Validate checked-in schema and representative projects
        run: .venv/bin/python crates/vestra-cli/tests/schema_validation.py
      - name: Verify generated schema is current
        run: |
          set -euo pipefail
          schema_tmp_dir=$(mktemp -d)
          trap 'rm -rf "$schema_tmp_dir"' EXIT
          nix develop --command cargo run -q -p vestra-cli -- \
            generate-schema --output "$schema_tmp_dir/project.schema.json"
          cmp "$schema_tmp_dir/project.schema.json" schemas/project.schema.json

  build-smoke:
    name: Build Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Build the Rust workspace and CLI
        run: |
          nix develop --command cargo build --workspace --all-features
          nix develop --command target/debug/ve --help
      - name: Build and import the Python wheel
        run: |
          set -euo pipefail
          rm -rf dist smoke-venv
          nix develop --command uv build --wheel --out-dir dist
          uv venv smoke-venv
          uv pip install --python smoke-venv/bin/python dist/*.whl
          smoke-venv/bin/python -c 'import vestra; from vestra import Image, Rectangle, Ellipse, Circle, Line, Polygon, Text, Video; print(vestra.__version__)'

  wgpu-software-correctness:
    name: WGPU Software Correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Verify software adapter environment
        run: |
          set -euo pipefail
          nix develop --command bash -euo pipefail -c '
            echo "WGPU SOFTWARE correctness (no hardware claim)"
            vulkaninfo --summary
            scripts/verify-wgpu.sh
          '

  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs:
      - rust-format
      - python-format
      - rust-check
      - rust-clippy
      - rust-tests
      - python-lint
      - python-tests
      - schema-contract
      - build-smoke
      - wgpu-software-correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs to pass
        run: |
          test "${{ needs.rust-format.result }}" = success
          test "${{ needs.python-format.result }}" = success
          test "${{ needs.rust-check.result }}" = success
          test "${{ needs.rust-clippy.result }}" = success
          test "${{ needs.rust-tests.result }}" = success
          test "${{ needs.python-lint.result }}" = success
          test "${{ needs.python-tests.result }}" = success
          test "${{ needs.schema-contract.result }}" = success
          test "${{ needs.build-smoke.result }}" = success
          test "${{ needs.wgpu-software-correctness.result }}" = success
