name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust-format:
    name: Rust Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Check Rust formatting
        run: nix develop .#ci --command cargo fmt --all -- --check

  python-format:
    name: Python Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Check maintained Python format surface
        run: >-
          nix develop .#ci --command uvx --from 'ruff>=0.12,<0.13'
          ruff format --check
          python/vestra/sources/base.py python/vestra/sources/__init__.py

  rust-check:
    name: Rust Check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Verify native build environment
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -euo pipefail -c '
            rustc --version
            cargo --version
            command -v ffmpeg
            ffmpeg -version 2>&1 | sed -n "1p"
            for library in libavcodec libavformat libavutil libswscale; do
              printf "%s=" "$library"
              pkg-config --modversion "$library"
            done
          '
      - name: Check media crate native dependencies
        run: nix develop .#ci --command cargo check -p vestra-media --all-features
      - name: Check workspace
        run: nix develop .#ci --command cargo check --workspace --all-features

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Run Clippy
        run: >-
          nix develop .#ci --command cargo clippy --workspace --all-targets
          --all-features -- -D warnings

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Run workspace tests
        run: nix develop .#ci --command cargo test --workspace --all-features

  python-lint:
    name: Python Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Lint maintained Python package
        run: nix develop .#ci --command uvx --from 'ruff>=0.12,<0.13' ruff check python/vestra

  python-tests:
    name: Python Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Build the native extension and run Python tests
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -euo pipefail -c '
            which python
            python --version
            which uv
            uv --version
            uv sync --locked --extra dev
            uv run python -c "import vestra"
            uv run pytest
            uv run python -m compileall -q python/vestra
          '

  schema-contract:
    name: Schema Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Validate schema and native package contract
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -euo pipefail -c '
            uv sync --locked --extra test
            uv run python -c "import vestra"
            uv run python crates/vestra-cli/tests/schema_validation.py
            schema_tmp_dir=$(mktemp -d)
            trap "rm -rf \"$schema_tmp_dir\"" EXIT
            cargo run -q -p vestra-cli -- generate-schema --output "$schema_tmp_dir/project.schema.json"
            cmp "$schema_tmp_dir/project.schema.json" schemas/project.schema.json
          '

  build-smoke:
    name: Build Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Build Rust, CLI, and Python package
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -euo pipefail -c '
            cargo build --workspace --all-features
            target/debug/ve --help
            rm -rf dist smoke-venv
            uv build --wheel --out-dir dist
            uv venv smoke-venv
            uv pip install --python smoke-venv/bin/python dist/*.whl
            smoke-venv/bin/python scripts/verify-wheel.py
          '

  wgpu-software-correctness:
    name: WGPU Software Correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Verify software adapter environment
        run: |
          set -euo pipefail
          nix develop .#wgpu-software --command bash -euo pipefail -c '
            echo "WGPU SOFTWARE correctness (no hardware claim)"
            command -v vulkaninfo
            vulkaninfo --summary
            scripts/verify-wgpu.sh --software
          '

  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs:
      - rust-format
      - python-format
      - rust-check
      - rust-clippy
      - rust-tests
      - python-lint
      - python-tests
      - schema-contract
      - build-smoke
      - wgpu-software-correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs to pass
        run: |
          test "${{ needs.rust-format.result }}" = success
          test "${{ needs.python-format.result }}" = success
          test "${{ needs.rust-check.result }}" = success
          test "${{ needs.rust-clippy.result }}" = success
          test "${{ needs.rust-tests.result }}" = success
          test "${{ needs.python-lint.result }}" = success
          test "${{ needs.python-tests.result }}" = success
          test "${{ needs.schema-contract.result }}" = success
          test "${{ needs.build-smoke.result }}" = success
          test "${{ needs.wgpu-software-correctness.result }}" = success
