name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  style:
    name: Style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.native == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name != 'workflow_dispatch'
        with:
          # Unknown paths trigger validation too: only documentation is excluded.
          predicate-quantifier: every
          filters: |
            native:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Check Rust/Python formatting and Python lint
        run: nix develop .#ci --command just style

  rust:
    name: Rust
    needs: style
    if: needs.style.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Keep debug symbols out of CI artifacts so the WGPU test binary can link
      # within the hosted runner's disk budget. Assertions remain enabled.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - uses: Swatinem/rust-cache@v2
        with:
          # Query the pinned Nix toolchain, not the runner's preinstalled Rust.
          cmd-format: nix develop .#wgpu-software --command {0}
          # Avoid restoring large artifacts built with the previous debug profile.
          prefix-key: v1-rust-compact
          key: ${{ hashFiles('flake.nix', 'flake.lock') }}
      - name: Verify native build environment
        run: |
          nix develop .#wgpu-software --command bash -euo pipefail <<'SCRIPT'
            rustc --version
            cargo --version
            command -v ffmpeg
            ffmpeg -version 2>&1 | sed -n "1p"
            for library in libavcodec libavformat libavutil libswscale; do
              printf "%s=" "$library"
              pkg-config --modversion "$library"
            done
          SCRIPT
      - name: Run Clippy (includes workspace compilation checks)
        run: nix develop .#wgpu-software --command just lint-rust
      - name: Run workspace tests and strict software WGPU correctness
        run: |
          nix develop .#wgpu-software --command bash -euo pipefail <<'SCRIPT'
            echo "WGPU SOFTWARE correctness (no hardware claim)"
            vulkaninfo --summary
            just wgpu-software
          SCRIPT
      - name: Check CLI help and generated schema freshness
        run: nix develop .#wgpu-software --command just cli-smoke schema-freshness

  python:
    name: Python
    needs: style
    if: needs.style.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop .#wgpu-software --command {0}
          key: ${{ hashFiles('flake.nix', 'flake.lock', 'pyproject.toml', 'uv.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-
      - name: Build the native extension and run Python and schema tests
        run: |
          nix develop .#wgpu-software --command bash -euo pipefail <<'SCRIPT'
            python --version
            uv --version
            vulkaninfo --summary
            just python-test
            just schema-validation
            just examples showcase-smoke
            uv run pytest tests/test_documentation_links.py tests/test_showcase_assets.py tests/test_benchmark_compare.py tests/test_benchmark_record.py
          SCRIPT
      - name: Build and smoke test installed wheel (main and manual runs)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: nix develop .#ci --command just wheel-smoke

  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs: [style, rust, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require validation to pass (allow documented skips only)
        env:
          STYLE_RESULT: ${{ needs.style.result }}
          NATIVE_REQUIRED: ${{ needs.style.outputs.native }}
          RUST_RESULT: ${{ needs.rust.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: |
          test "$STYLE_RESULT" = success
          case "$NATIVE_REQUIRED" in
            true)
              test "$RUST_RESULT" = success
              test "$PYTHON_RESULT" = success
              ;;
            false)
              test "$RUST_RESULT" = skipped
              test "$PYTHON_RESULT" = skipped
              ;;
            *) exit 1 ;;
          esac
