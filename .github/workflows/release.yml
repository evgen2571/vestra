name: Release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Revision or version tag to prepare (publication requires a version tag)
        required: true
        default: develop
        type: string
      publish:
        description: Publish this version tag after validation and protected PyPI approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-artifacts
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Freeze revision and verify version, license and tag
        id: identity
        env:
          SOURCE_REF: ${{ inputs.ref || github.ref }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          flags=()
          if [[ "$PUBLISH" == true ]]; then flags+=(--publish); fi
          python scripts/release-metadata.py --ref "$SOURCE_REF" "${flags[@]}" --output "$GITHUB_OUTPUT"

  artifacts:
    needs: version
    uses: ./.github/workflows/artifacts.yml
    with:
      revision: ${{ needs.version.outputs.revision }}

  stage:
    if: github.event_name == 'push' || inputs.publish
    needs: [version, artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Record exact artifact identities
        env:
          REVISION: ${{ needs.version.outputs.revision }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release-manifest.py dist --revision "$REVISION" --version "$VERSION" --verify-pypi
      - name: Stage tested artifacts and source as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          REVISION: ${{ needs.version.outputs.revision }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$REVISION"
          if gh release view "$RELEASE_TAG" --json isPrerelease,isDraft > release-state.json; then
            python -c 'import json; r=json.load(open("release-state.json")); assert r["isPrerelease"] or r["isDraft"], "refusing to replace a complete release"'
            count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
            if [[ "$count" != 0 ]]; then
              gh release download "$RELEASE_TAG" --dir staged
              python scripts/release-manifest.py dist --revision "$REVISION" --version "$VERSION" --compare-directory staged
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "$RELEASE_TAG (publication pending)" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: [version, artifacts, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: artifacts
      - name: Recheck tag and prepare only tested Python distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          REVISION: ${{ needs.version.outputs.revision }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$REVISION"
          python scripts/release-manifest.py artifacts --revision "$REVISION" --version "$VERSION" --verify-pypi
          mkdir dist
          cp artifacts/*.whl artifacts/vestra-*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Resume a partially successful upload with the same tested artifacts.
          skip-existing: true

  complete:
    if: github.event_name == 'push' || inputs.publish
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Mark GitHub release complete only after PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          REVISION: ${{ needs.version.outputs.revision }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$REVISION"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --title "$RELEASE_TAG"
