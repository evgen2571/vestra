[workspace]
resolver = "2"
members = [
    "crates/vestra-core",
    "crates/vestra-progress",
    "crates/vestra-observability",
    "crates/vestra-render",
    "crates/vestra-media",
    "crates/vestra",
    "crates/vestra-python",
    "crates/vestra-cli",
]

[workspace.package]
version = "0.1.0"

# ffmpeg-sys-next 8.1.0 injects -march=native into bundled FFmpeg builds.
# Keep a local patch until upstream removes that host-specific flag.
[patch.crates-io]
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
