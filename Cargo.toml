[package]
name = "video-editor"
version = "0.1.0"
edition = "2024"
description = "A standalone JSON-driven declarative video renderer"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
ctrlc = "3.4"
image = { version = "0.25", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
pollster = "0.4"
wgpu = "22"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
sha2 = "0.10"
tempfile = "3"

[[bench]]
name = "animation_effects"
harness = false

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
