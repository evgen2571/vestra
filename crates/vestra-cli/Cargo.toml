[package]
name = "vestra-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line frontend for vestra"
license = "MIT"
publish = false

[[bin]]
name = "ve"
path = "src/main.rs"

[dependencies]
vestra = { path = "../vestra" }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
sha2 = "0.10"
tempfile = "3"

[lints]
workspace = true
