[package]
name = "vestra-media"
version = "0.1.0"
edition = "2024"
description = "Internal media probing, encoding, and output handling for vestra"
license = "MIT"
publish = false

[dependencies]
vestra-core = { path = "../vestra-core" }
vestra-render = { path = "../vestra-render", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rustfft = "6"
image = { version = "0.25", default-features = false }
ffmpeg-next = { version = "8.0.0", default-features = false, features = ["format", "software-scaling"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
