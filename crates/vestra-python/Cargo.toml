[package]
name = "vestra-python"
version.workspace = true
edition = "2024"
description = "Python bindings for the vestra SDK"
license = "MIT"
repository = "https://github.com/evgen2571/vestra"
homepage = "https://github.com/evgen2571/vestra"
documentation = "https://github.com/evgen2571/vestra/tree/main/docs"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
pythonize = { version = "0.29", features = ["serde_json"] }
serde_json = "1"
vestra = { path = "../vestra" }
vestra-observability = { path = "../vestra-observability" }

[lints]
workspace = true
