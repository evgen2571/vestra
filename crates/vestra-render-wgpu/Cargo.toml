[package]
name = "vestra-render-wgpu"
version.workspace = true
edition = "2024"
description = "Internal WGPU frame rendering for vestra"
license = "MIT"
publish = false

[features]
default = ["adapter-tests"]
# Controls adapter-dependent unit tests only; renderer availability is unchanged.
adapter-tests = []

[dependencies]
vestra-core = { path = "../vestra-core" }
vestra-render-common = { path = "../vestra-render-common" }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false }
naga = { version = "23", features = ["wgsl-in"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
wgpu = "23.0.1"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
