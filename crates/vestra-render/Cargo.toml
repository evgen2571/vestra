[package]
name = "vestra-render"
version.workspace = true
edition = "2024"
description = "CPU and WGPU frame rendering for vestra"
license = "MIT"
publish = false

[features]
default = ["cpu", "wgpu"]
cpu = ["dep:vestra-render-cpu"]
wgpu = ["dep:bytemuck", "dep:naga", "dep:pollster", "dep:wgpu"]

[[test]]
name = "parity"
required-features = ["cpu", "wgpu"]

[[example]]
name = "wgpu_adapters"
required-features = ["wgpu"]

[dependencies]
vestra-core = { path = "../vestra-core" }
vestra-render-common = { path = "../vestra-render-common" }
vestra-render-cpu = { path = "../vestra-render-cpu", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
image = { version = "0.25", default-features = true }
naga = { version = "23", features = ["wgsl-in"], optional = true }
pollster = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
wgpu = { version = "23.0.1", optional = true }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
