[package]
name = "video-editor-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line frontend for video-editor"
license = "MIT"
publish = false

[[bin]]
name = "video-editor"
path = "src/main.rs"

[dependencies]
video-editor = { path = "../video-editor" }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
sha2 = "0.10"
tempfile = "3"

[lints]
workspace = true
