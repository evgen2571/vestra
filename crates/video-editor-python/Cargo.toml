[package]
name = "video-editor-python"
version = "0.1.0"
edition = "2024"
description = "Python bindings for the video-editor SDK"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
pythonize = { version = "0.29", features = ["serde_json"] }
serde_json = "1"
video-editor = { path = "../video-editor" }

[lints]
workspace = true
