[package]
name = "video-editor"
version = "0.1.0"
edition = "2024"
description = "Public Rust SDK for the JSON-driven video editor"
license = "MIT"
publish = false

[features]
default = ["cpu", "wgpu"]
cpu = ["video-editor-render/cpu"]
wgpu = ["video-editor-render/wgpu", "dep:pollster", "dep:wgpu"]

[dependencies]
video-editor-core = { path = "../video-editor-core" }
video-editor-render = { path = "../video-editor-render", default-features = false }
video-editor-media = { path = "../video-editor-media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = true }
pollster = { version = "0.4", optional = true }
wgpu = { version = "22", optional = true }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "animation_effects"
harness = false

[lints]
workspace = true
