<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="title desc">
  <title id="title">The SDK coordinates native work</title>
  <desc id="desc">Python authoring lowers a canonical snapshot through vestra-python, the PyO3 extension. It calls the vestra SDK, also used by Rust applications and the ve CLI. The SDK calls core for model, planning and evaluation; render for CPU or WGPU frames; and media for assets, audio and output. These arrows show SDK coordination, not Cargo dependencies.</desc>
  <style>
    :root { --bg:#f0f2f4; --panel:#e1e6eb; --ink:#242b33; --muted:#4e5d6a; --line:#697988; --shape:#7194b3; --edge:#3e607e; }
    @media (prefers-color-scheme:dark) { :root { --bg:#292e35; --panel:#353e48; --ink:#eef2f6; --muted:#bdc9d3; --line:#95a7b6; --shape:#83a5c2; --edge:#bdd0e0; } }
    text { fill:var(--ink); font:22px system-ui,sans-serif; }
    .muted { fill:var(--muted); }
    .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
    .shape { fill:var(--panel); stroke:var(--edge); stroke-width:2.5; }
    .line { fill:none; stroke:var(--line); stroke-width:2; }
    .guide { fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:4 5; }
    .arrow { fill:none; stroke:var(--line); stroke-width:2; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="480" height="660" rx="10" fill="var(--bg)"/>
  <rect x="20" y="20" width="440" height="70" rx="6" class="panel"/>
  <text x="240" y="49" text-anchor="middle">Python authoring</text>
  <text x="240" y="77" text-anchor="middle">lower to canonical snapshot</text>
  <path d="M180 90v26" class="arrow"/>
  <rect x="20" y="120" width="440" height="70" rx="6" class="panel"/>
  <text x="240" y="149" text-anchor="middle">vestra-python · PyO3</text>
  <text x="240" y="177" text-anchor="middle">snapshot + runtime requests</text>
  <path d="M180 190v56" class="arrow"/>
  <text x="350" y="220" text-anchor="middle">Rust / ve CLI</text>
  <path d="M350 228v18" class="arrow"/>
  <rect x="20" y="250" width="440" height="70" rx="6" class="shape"/>
  <text x="240" y="279" text-anchor="middle">vestra · Editor</text>
  <text x="240" y="307" text-anchor="middle">coordinates native work</text>
  <path d="M50 320v280" class="line"/>
  <path d="M50 400h46M50 500h46M50 600h46" class="arrow"/>
  <rect x="100" y="360" width="360" height="80" rx="6" class="panel"/>
  <text x="280" y="391" text-anchor="middle">vestra-core</text>
  <text x="280" y="421" text-anchor="middle">model → plan → evaluation</text>
  <rect x="100" y="460" width="360" height="80" rx="6" class="panel"/>
  <text x="280" y="491" text-anchor="middle">vestra-render</text>
  <text x="280" y="521" text-anchor="middle">CPU / WGPU frames</text>
  <rect x="100" y="560" width="360" height="80" rx="6" class="panel"/>
  <text x="280" y="591" text-anchor="middle">vestra-media</text>
  <text x="280" y="621" text-anchor="middle">assets · audio · output</text>
</svg>
