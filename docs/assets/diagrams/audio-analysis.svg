<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc">
  <title id="title">The master mix has independent output and analysis branches</title>
  <desc id="desc">Clips pass through clip, track and master processing. The master mix branches to output audio and prepared analysis. Disabling output audio does not remove analysis. Analysis supplies scalar signals bound to one property or frequency bands drawn by Spectrum2D, two independent visual routes.</desc>
  <style>
    :root { --bg:#f0f2f4; --panel:#e1e6eb; --ink:#242b33; --muted:#4e5d6a; --line:#697988; --shape:#7194b3; --edge:#3e607e; --stripe:#466c8c; }
    @media (prefers-color-scheme:dark) { :root { --bg:#292e35; --panel:#353e48; --ink:#eef2f6; --muted:#bdc9d3; --line:#95a7b6; --shape:#83a5c2; --edge:#bdd0e0; --stripe:#4b6e8d; } }
    text { fill:var(--ink); font:22px system-ui,sans-serif; }
    .small { font-size:21px; }
    .muted { fill:var(--muted); }
    .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
    .shape { fill:var(--shape); stroke:var(--edge); stroke-width:2; }
    .line { fill:none; stroke:var(--line); stroke-width:2; }
    .guide { fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:4 5; }
    .arrow { fill:none; stroke:var(--line); stroke-width:2; marker-end:url(#arrow); }
    .point { fill:var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="480" height="390" rx="10" fill="var(--bg)"/>
  <rect x="20" y="16" width="440" height="46" class="panel" rx="5"/>
  <text x="240" y="46" class="small" text-anchor="middle">Clips → clip / track / master effects</text>
  <path d="M240 64v18" class="arrow"/>
  <rect x="130" y="86" width="220" height="46" class="panel" rx="5"/>
  <text x="240" y="116" text-anchor="middle">Master mix</text>
  <path d="M175 134v21H120v21" class="arrow"/>
  <path d="M305 134v21h45v21" class="arrow"/>
  <rect x="20" y="181" width="200" height="68" class="panel" rx="5"/>
  <text x="120" y="210" class="small" text-anchor="middle">Output audio</text>
  <text x="120" y="236" class="small muted" text-anchor="middle">Can be disabled</text>
  <rect x="250" y="181" width="210" height="68" class="panel" rx="5"/>
  <text x="355" y="210" class="small" text-anchor="middle">Prepared analysis</text>
  <text x="355" y="236" class="small muted" text-anchor="middle">At project time</text>
  <path d="M355 251v22H130v23" class="arrow"/>
  <path d="M355 273v23" class="arrow"/>
  <rect x="20" y="301" width="220" height="68" class="panel" rx="5"/>
  <text x="130" y="330" class="small" text-anchor="middle">Signal → binding</text>
  <text x="130" y="356" class="small" text-anchor="middle">One visual property</text>
  <rect x="260" y="301" width="200" height="68" class="panel" rx="5"/>
  <text x="360" y="330" class="small" text-anchor="middle">Frequency bands</text>
  <text x="360" y="356" class="small" text-anchor="middle">Spectrum2D</text>
</svg>
