<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330" role="img" aria-labelledby="title desc">
  <title id="title">The anchor selects the attached point</title>
  <desc id="desc">Two 640 by 360 canvases share position 0.25, 0.5, which is pixel 160, 180. The same 160 by 80 rectangle centers on that point with anchor 0.5, 0.5. With anchor 0, 0 its top-left moves to that point. Crosshairs stay fixed.</desc>
  <style>
    :root { --bg:#f0f2f4; --panel:#e1e6eb; --ink:#242b33; --muted:#4e5d6a; --line:#697988; --shape:#7194b3; --edge:#3e607e; --stripe:#466c8c; }
    @media (prefers-color-scheme:dark) { :root { --bg:#292e35; --panel:#353e48; --ink:#eef2f6; --muted:#bdc9d3; --line:#95a7b6; --shape:#83a5c2; --edge:#bdd0e0; --stripe:#4b6e8d; } }
    text { fill:var(--ink); font:22px system-ui,sans-serif; }
    .small { font-size:21px; }
    .muted { fill:var(--muted); }
    .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
    .shape { fill:var(--shape); stroke:var(--edge); stroke-width:2; }
    .line { fill:none; stroke:var(--line); stroke-width:2; }
    .guide { fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:4 5; }
    .arrow { fill:none; stroke:var(--line); stroke-width:2; marker-end:url(#arrow); }
    .point { fill:var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="480" height="330" rx="10" fill="var(--bg)"/>
  <text x="20" y="34">Same position: (0.25, 0.5)</text>
  <text x="20" y="68" class="small muted">Canvas 640 × 360; shape 160 × 80</text>
  <text x="126" y="113" class="small" text-anchor="middle">Anchor (0.5, 0.5)</text>
  <text x="354" y="113" class="small" text-anchor="middle">Anchor (0, 0)</text>
  <rect x="20" y="134" width="212" height="119.25" class="panel"/>
  <rect x="248" y="134" width="212" height="119.25" class="panel"/>
  <path d="M73 134v119.25M20 193.625h212M301 134v119.25M248 193.625h212" class="guide"/>
  <rect x="46.5" y="180.375" width="53" height="26.5" class="shape"/>
  <rect x="301" y="193.625" width="53" height="26.5" class="shape"/>
  <path d="M66 193.625h14m-7-7v14" class="line" style="stroke:var(--ink);stroke-width:2.5"/>
  <path d="M294 193.625h14m-7-7v14" class="line" style="stroke:var(--ink);stroke-width:2.5"/>
  <text x="126" y="291" class="small" text-anchor="middle">Center attached</text>
  <text x="354" y="291" class="small" text-anchor="middle">Top-left attached</text>
</svg>
