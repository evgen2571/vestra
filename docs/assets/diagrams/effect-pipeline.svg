<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc">
  <title id="title">Layer processing before final output</title>
  <desc id="desc">Each row continues the layer processing order: source size and crop, pre-transform Motion Tile, transform, ordinary effects, owned masks, track matte, opacity and blend into the parent. After all root layers have composed, project post-effects produce the final frame.</desc>
  <style>
    :root { --bg:#f0f2f4; --panel:#e1e6eb; --ink:#242b33; --muted:#4e5d6a; --line:#697988; --shape:#7194b3; --edge:#3e607e; --stripe:#466c8c; }
    @media (prefers-color-scheme:dark) { :root { --bg:#292e35; --panel:#353e48; --ink:#eef2f6; --muted:#bdc9d3; --line:#95a7b6; --shape:#83a5c2; --edge:#bdd0e0; --stripe:#4b6e8d; } }
    text { fill:var(--ink); font:22px system-ui,sans-serif; }
    .small { font-size:21px; }
    .muted { fill:var(--muted); }
    .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
    .shape { fill:var(--shape); stroke:var(--edge); stroke-width:2; }
    .line { fill:none; stroke:var(--line); stroke-width:2; }
    .guide { fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:4 5; }
    .arrow { fill:none; stroke:var(--line); stroke-width:2; marker-end:url(#arrow); }
    .point { fill:var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="480" height="390" rx="10" fill="var(--bg)"/>
  <rect x="20" y="16" width="440" height="48" class="panel" rx="5"/>
  <rect x="20" y="87" width="440" height="48" class="panel" rx="5"/>
  <rect x="20" y="158" width="440" height="48" class="panel" rx="5"/>
  <rect x="20" y="229" width="440" height="48" class="panel" rx="5"/>
  <rect x="20" y="326" width="440" height="48" class="panel" rx="5"/>
  <text x="240" y="47" text-anchor="middle">Size / crop → Motion Tile</text>
  <text x="240" y="118" text-anchor="middle">Transform → ordinary effects</text>
  <text x="240" y="189" text-anchor="middle">Owned masks → track matte</text>
  <text x="240" y="260" text-anchor="middle">Opacity + blend into parent</text>
  <path d="M240 66v18" class="arrow"/>
  <path d="M240 137v18" class="arrow"/>
  <path d="M240 208v18" class="arrow"/>
  <text x="240" y="307" class="small muted" text-anchor="middle">After all root layers compose</text>
  <path d="M240 277v10" class="arrow"/>
  <text x="240" y="357" text-anchor="middle">Project effects → final frame</text>
</svg>
