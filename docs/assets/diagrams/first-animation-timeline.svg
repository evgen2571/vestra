<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" role="img" aria-labelledby="title description">
  <title id="title">Timing of the first animation</title>
  <desc id="description">Circle scale and stripe rotation animate from zero to 0.8 seconds. Title position animates from zero to 0.8 and opacity from zero to 0.6. Caption opacity fades from 0.5 to 1.1 seconds. The layers keep their final values until the project ends at three seconds.</desc>
  <rect width="480" height="350" rx="12" fill="#f5f7fb"/>
  <g font-family="system-ui, sans-serif" font-size="20" fill="#172c4b">
    <path d="M180 58V296M270 58V296M360 58V296M450 58V296" stroke="#cbd6e6"/>
    <text x="174" y="37">0</text><text x="264" y="37">1</text><text x="354" y="37">2</text><text x="434" y="37">3 s</text>
    <text x="16" y="95">Circle scale</text>
    <text x="16" y="145">Stripe rotation</text>
    <text x="16" y="195">Title position</text>
    <text x="16" y="245">Title opacity</text>
    <text x="16" y="295">Caption opacity</text>
    <g stroke="#cbd6e6" stroke-width="8" stroke-linecap="round">
      <path d="M180 88H450M180 138H450M180 188H450M180 238H450M180 288H450"/>
    </g>
    <g stroke="#315dcc" stroke-width="12" stroke-linecap="round">
      <path d="M180 88H252M180 138H252M180 188H252M180 238H234"/>
    </g>
    <path d="M225 288H279" stroke="#d04b36" stroke-width="12" stroke-linecap="round"/>
    <text x="300" y="194" fill="#526985">Final values</text>
    <g fill="#172c4b" font-size="18">
      <text x="240" y="72">0.8</text><text x="240" y="122">0.8</text>
      <text x="240" y="172">0.8</text><text x="222" y="222">0.6</text>
      <text x="212" y="320">0.5</text><text x="267" y="320">1.1</text>
    </g>
  </g>
</svg>
