<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" role="img" aria-labelledby="title description">
  <title id="title">Rectangle position keyframes</title>
  <desc id="description">At zero seconds the rectangle's x position is 0.25. At 1.5 seconds it is 0.75. At three seconds it is 0.25 again. Both intervals use ease in/out interpolation. The three-second endpoint is outside the video's sampled frames.</desc>
  <rect width="660" height="270" rx="12" fill="#f5f7fb"/>
  <g font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" fill="#101c24">
    <path d="M70 130H590" stroke="#5d7065" stroke-width="3"/>
    <path d="M83 94H302M349 94H568" stroke="#3a7351" stroke-width="3"/>
    <path d="m293 85 12 9-12 9M559 85l12 9-12 9" fill="none" stroke="#3a7351" stroke-width="3"/>
    <text x="195" y="61">Ease in/out</text><text x="461" y="61">Ease in/out</text>
    <g fill="#b8e3bc" stroke="#3a7351" stroke-width="2">
      <rect x="61" y="120" width="20" height="20" rx="4"/>
      <rect x="320" y="120" width="20" height="20" rx="4"/>
      <rect x="579" y="120" width="20" height="20" rx="4"/>
    </g>
    <text x="71" y="181">0 s</text><text x="330" y="181">1.5 s</text><text x="589" y="181">3 s</text>
    <text x="71" y="222" font-size="20" fill="#445d50">x = 0.25</text>
    <text x="330" y="222" font-size="20" fill="#445d50">x = 0.75</text>
    <text x="589" y="222" font-size="20" fill="#445d50">x = 0.25</text>
  </g>
</svg>
