<svg xmlns="http://www.w3.org/2000/svg" width="480" height="180" viewBox="0 0 480 180" role="img" aria-labelledby="title desc">
  <title id="title">Frames include the start and exclude the end</title>
  <desc id="desc">A one-second output at 30 frames per second samples 0, 1/30, 2/30 through 29/30 seconds. Filled points mark frames; an open circle at 1 second marks the excluded endpoint. Intermediate frames are omitted from this schematic.</desc>
  <style>
    :root { --bg:#f0f2f4; --ink:#242b33; --line:#697988; }
    @media (prefers-color-scheme:dark) { :root { --bg:#292e35; --ink:#eef2f6; --line:#95a7b6; } }
    text { fill:var(--ink); font:22px system-ui,sans-serif; }
  </style>
  <rect width="480" height="180" rx="10" fill="var(--bg)"/>
  <text x="20" y="35">1 second · 30 frames</text>
  <path d="M40 80H440" stroke="var(--line)" stroke-width="2"/>
  <g fill="var(--ink)">
    <circle cx="40" cy="80" r="5"/>
    <circle cx="120" cy="80" r="5"/>
    <circle cx="200" cy="80" r="5"/>
    <circle cx="350" cy="80" r="5"/>
  </g>
  <circle cx="440" cy="80" r="6" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="40" y="118">0</text>
    <text x="120" y="118">1/30</text>
    <text x="200" y="118">2/30</text>
    <text x="275" y="118">…</text>
    <text x="350" y="118">29/30</text>
    <text x="440" y="118">1</text>
  </g>
  <text x="20" y="158">● Frame sampled</text>
  <text x="250" y="158">○ End excluded</text>
</svg>
