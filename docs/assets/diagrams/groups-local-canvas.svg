<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc">
  <title id="title">Measure the child from the group's top-left</title>
  <desc id="desc">The root canvas is 640 by 360 pixels. A centered 320 by 180 group has its top-left at root pixel 160, 90. A gold child rectangle has its center 80 pixels right and 90 pixels down from the group's top-left. In root pixels the child center is 160 plus 80, 90 plus 90, or 240, 180. The group has scale one and no rotation.</desc>
  <style>
    :root { --bg:#f0f2f4; --group:#d8e5ee; --ink:#242b33; --muted:#4e5d6a; --line:#697988; --edge:#3e607e; }
    @media (prefers-color-scheme:dark) { :root { --bg:#292e35; --group:#344d60; --ink:#eef2f6; --muted:#bdc9d3; --line:#95a7b6; --edge:#bdd0e0; } }
    text { fill:var(--ink); font:22px system-ui,sans-serif; }
    .label { font-size:21px; }
    .leader { fill:none; stroke:var(--line); stroke-width:1.5; }
  </style>
  <rect width="480" height="390" rx="10" fill="var(--bg)"/>
  <text x="24" y="31">Root canvas · 640 × 360 px</text>
  <rect x="24" y="60" width="432" height="243" fill="none" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="24" cy="60" r="4" fill="var(--ink)"/>
  <text x="36" y="85" class="label">Root origin (0, 0)</text>
  <text x="132" y="107" class="label">Top-left: (160, 90)</text>
  <rect x="132" y="120.75" width="216" height="121.5" fill="var(--group)" stroke="var(--edge)" stroke-width="2"/>
  <circle cx="132" cy="120.75" r="4" fill="var(--edge)"/>
  <text x="144" y="148" class="label">Group · 320 × 180</text>
  <rect x="152.25" y="161.25" width="67.5" height="40.5" rx="3" fill="#e9bd72" stroke="#7a5a22" stroke-width="1.5"/>
  <text x="186" y="189" class="label" text-anchor="middle" style="fill:#242b33">Child</text>
  <path d="M186 202v51l54 12" class="leader"/>
  <text x="240" y="288" class="label" text-anchor="middle">Child center in group: (80, 90)</text>
  <text x="24" y="338">Child center in root:</text>
  <text x="24" y="369" class="label">(160, 90) + (80, 90) = (240, 180)</text>
</svg>
