<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 710" role="img" aria-labelledby="title desc">
  <title id="title">Compose within group bounds, then place in parent</title>
  <desc id="desc">A 600 by 300 group canvas contains a 100 by 80 rectangle at local 150, 150. A second rectangle crosses the top edge and is clipped to the group bounds. The completed group is scaled by one half and centered in a 640 by 360 parent.</desc>
  <rect width="480" height="710" rx="12" fill="#f6f5f1"/>
  <g font-family="system-ui, sans-serif" font-size="24" fill="#202522">
    <text x="24" y="40">1. Local canvas: 600 × 300</text>
    <rect x="24" y="64" width="432" height="216" fill="#e7ebee" stroke="#556673" stroke-width="2"/>
    <path d="M132 64v216M24 172h432" stroke="#8a938c" stroke-dasharray="6 6"/>
    <rect x="96" y="143.2" width="72" height="57.6" fill="#a6c9b0" stroke="#466451" stroke-width="2"/>
    <rect x="348" y="42.4" width="72" height="21.6" fill="none" stroke="#745e51" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="348" y="64" width="72" height="64.8" fill="#d1b69f" stroke="#745e51" stroke-width="2"/>
    <text x="248" y="253">Clipped above</text>
    <path d="M123 172h18m-9-9v18" stroke="#202522" stroke-width="2"/>
    <text x="188" y="162">(0.25, 0.5)</text><text x="188" y="200">= (150, 150) px</text>
    <text x="24" y="318">2. Clip to these local bounds</text>
    <path d="M240 338v32m-9-12 9 12 9-12" fill="none" stroke="#466451" stroke-width="3"/>
    <text x="24" y="411">3. Scale 0.5; center in parent</text>
    <rect x="24" y="434" width="432" height="243" fill="#e7ebee" stroke="#556673" stroke-width="2"/>
    <rect x="138.75" y="504.9" width="202.5" height="101.2" fill="#d5dfd7" stroke="#466451" stroke-width="2"/>
    <rect x="172.5" y="542" width="33.75" height="27" fill="#a6c9b0" stroke="#466451" stroke-width="2"/>
    <rect x="290.6" y="504.9" width="33.75" height="30.4" fill="#d1b69f" stroke="#745e51" stroke-width="2"/>
    <path d="M230 555.5h20m-10-10v20" stroke="#202522" stroke-width="2"/>
    <text x="40" y="660">Parent: 640 × 360 pixels</text>
  </g>
</svg>
