<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" role="img" aria-labelledby="title description">
  <title id="title">Interpolation for keyframe intervals</title>
  <desc id="description">Keyframes A, B and C are at zero, 1.5 and three seconds. Ease in/out on B controls the interval from A to B. Linear on C controls the interval from B to C.</desc>
  <rect width="660" height="270" rx="12" fill="#f5f7fb"/>
  <g font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" fill="#101c24">
    <path d="M65 130H595" stroke="#5d7065" stroke-width="3"/>
    <path d="M80 94H300M345 94H565" stroke="#3a7351" stroke-width="3"/>
    <path d="m291 85 12 9-12 9M556 85l12 9-12 9" fill="none" stroke="#3a7351" stroke-width="3"/>
    <text x="196" y="62">Ease in/out</text><text x="463" y="62">Linear</text>
    <path d="M65 130l9-9 9 9-9 9ZM321 130l9-9 9 9-9 9ZM577 130l9-9 9 9-9 9Z" fill="#3a7351"/>
    <text x="74" y="178">A · 0 s</text><text x="330" y="178">B · 1.5 s</text><text x="586" y="178">C · 3 s</text>
    <text x="330" y="225" font-size="19" fill="#445d50">Set on B</text><text x="586" y="225" font-size="19" fill="#445d50">Set on C</text>
  </g>
</svg>
