<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">Coverage reveals the original content</title>
  <desc id="desc">A striped blue content layer is multiplied by circle coverage, white one on black zero. The result preserves the same blue stripes inside the circle. Subtracting a smaller circle removes the center, leaving a striped ring rather than adding visible mask color.</desc>
  <style>
    :root { --bg:#f0f2f4; --panel:#e1e6eb; --ink:#242b33; --muted:#4e5d6a; --line:#697988; --shape:#7194b3; --edge:#3e607e; --stripe:#466c8c; }
    @media (prefers-color-scheme:dark) { :root { --bg:#292e35; --panel:#353e48; --ink:#eef2f6; --muted:#bdc9d3; --line:#95a7b6; --shape:#83a5c2; --edge:#bdd0e0; --stripe:#4b6e8d; } }
    text { fill:var(--ink); font:22px system-ui,sans-serif; }
    .small { font-size:21px; }
    .muted { fill:var(--muted); }
    .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
    .shape { fill:var(--shape); stroke:var(--edge); stroke-width:2; }
    .line { fill:none; stroke:var(--line); stroke-width:2; }
    .guide { fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:4 5; }
    .arrow { fill:none; stroke:var(--line); stroke-width:2; marker-end:url(#arrow); }
    .point { fill:var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    </marker>
    <clipPath id="circle">
      <circle cx="400" cy="124" r="47"/>
    </clipPath>
    <clipPath id="ring">
      <path clip-rule="evenodd" d="M447 294a47 47 0 1 1-94 0 47 47 0 1 1 94 0M417 294a17 17 0 1 0-34 0 17 17 0 1 0 34 0"/>
    </clipPath>
  </defs>
  <rect width="480" height="360" rx="10" fill="var(--bg)"/>
  <text x="80" y="35" class="small" text-anchor="middle">Content</text>
  <text x="240" y="35" class="small" text-anchor="middle">Coverage</text>
  <text x="400" y="35" class="small" text-anchor="middle">Result</text>
  <rect x="16" y="60" width="128" height="128" class="shape"/>
  <path d="M58.667 60v128M101.333 60v128" class="line" style="stroke:var(--stripe);stroke-width:8"/>
  <rect x="176" y="60" width="128" height="128" fill="#111" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="240" cy="124" r="47" fill="#fff"/>
  <text x="160" y="133" text-anchor="middle">×</text>
  <text x="320" y="133" text-anchor="middle">=</text>
  <g clip-path="url(#circle)">
    <rect x="336" y="60" width="128" height="128" class="shape"/>
    <path d="M378.667 60v128M421.333 60v128" class="line" style="stroke:var(--stripe);stroke-width:8"/>
  </g>
  <text x="240" y="222" class="small muted" text-anchor="middle">1 reveals; 0 hides</text>
  <g clip-path="url(#circle)" transform="translate(-320 170)">
    <rect x="336" y="60" width="128" height="128" class="shape"/>
    <path d="M378.667 60v128M421.333 60v128" class="line" style="stroke:var(--stripe);stroke-width:8"/>
  </g>
  <text x="240" y="283" class="small" text-anchor="middle">Subtract center</text>
  <path d="M151 301h179" class="arrow"/>
  <g clip-path="url(#ring)">
    <rect x="336" y="230" width="128" height="128" class="shape"/>
    <path d="M378.667 230v128M421.333 230v128" class="line" style="stroke:var(--stripe);stroke-width:8"/>
  </g>
</svg>
