<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 650" role="img" aria-labelledby="title desc">
  <title id="title">Coverage reveals color from the owning layer</title>
  <desc id="desc">A colored rectangle provides visible content. A white circle on black represents coverage: white reveals and black hides. Subtracting a second smaller circle makes a ring of the original content.</desc>
  <rect width="480" height="650" rx="12" fill="#f6f5f1"/>
  <g font-family="system-ui, sans-serif" font-size="24" fill="#202522">
    <text x="24" y="40">Content supplies visible color</text>
    <rect x="24" y="62" width="432" height="94" fill="#a6c9b0" stroke="#466451" stroke-width="2"/>
    <path d="M168 62v94M312 62v94" stroke="#466451" stroke-width="8"/>
    <text x="24" y="207">Coverage: white 1, black 0</text>
    <rect x="24" y="230" width="432" height="142" fill="#202522"/>
    <circle cx="240" cy="301" r="57" fill="#fff"/>
    <text x="24" y="420">INTERSECT → circular reveal</text>
    <circle cx="240" cy="489" r="43" fill="#a6c9b0" stroke="#466451" stroke-width="2"/>
    <text x="24" y="570">SUBTRACT → remove center</text>
    <circle cx="240" cy="610" r="26" fill="#a6c9b0" stroke="#466451" stroke-width="2"/>
    <circle cx="240" cy="610" r="12" fill="#f6f5f1" stroke="#466451" stroke-width="2"/>
  </g>
</svg>
