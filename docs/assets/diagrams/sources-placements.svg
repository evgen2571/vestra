<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title desc">
  <title id="title">One source produces two independent placements</title>
  <desc id="desc">A blue 160 by 80 rectangle source is added twice to a 640 by 360 root canvas. The left copy is centered at one quarter of the canvas width with full opacity. The right copy is centered at three quarters with half opacity. Both retain the source geometry.</desc>
  <style>
    :root { --bg:#f0f2f4; --panel:#e1e6eb; --ink:#242b33; --muted:#4e5d6a; --line:#697988; --shape:#7194b3; --edge:#3e607e; --stripe:#466c8c; }
    @media (prefers-color-scheme:dark) { :root { --bg:#292e35; --panel:#353e48; --ink:#eef2f6; --muted:#bdc9d3; --line:#95a7b6; --shape:#83a5c2; --edge:#bdd0e0; --stripe:#4b6e8d; } }
    text { fill:var(--ink); font:22px system-ui,sans-serif; }
    .small { font-size:21px; }
    .muted { fill:var(--muted); }
    .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
    .shape { fill:var(--shape); stroke:var(--edge); stroke-width:2; }
    .line { fill:none; stroke:var(--line); stroke-width:2; }
    .guide { fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:4 5; }
    .arrow { fill:none; stroke:var(--line); stroke-width:2; marker-end:url(#arrow); }
    .point { fill:var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="480" height="400" rx="10" fill="var(--bg)"/>
  <text x="20" y="40">Rectangle source</text>
  <text x="20" y="74" class="small muted">160 × 80 px</text>
  <rect x="326" y="20" width="128" height="64" class="shape"/>
  <rect x="20" y="136" width="440" height="247.5" class="panel"/>
  <path d="M390 84v20H130v128" class="arrow"/>
  <path d="M390 104h-40v128" class="arrow"/>
  <text x="240" y="165" class="small" text-anchor="middle">640 × 360</text>
  <text x="240" y="195" class="small" text-anchor="middle">root canvas</text>
  <rect x="75" y="232.25" width="110" height="55" class="shape"/>
  <rect x="295" y="232.25" width="110" height="55" class="shape" opacity="0.5"/>
  <text x="130" y="325" class="small" text-anchor="middle">(0.25, 0.5)</text>
  <text x="350" y="325" class="small" text-anchor="middle">(0.75, 0.5)</text>
  <text x="130" y="362" class="small" text-anchor="middle">left: opacity 1</text>
  <text x="350" y="362" class="small" text-anchor="middle">right: opacity 0.5</text>
</svg>
