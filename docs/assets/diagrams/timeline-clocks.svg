<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" role="img" aria-labelledby="title desc">
  <title id="title">Three aligned clocks for half-speed video</title>
  <desc id="desc">A layer is active from project second two until the excluded end six. Project times 2 through 6 correspond to layer-local 0 through 4 and source times 10 through 12 in half-second source increments.</desc>
  <rect width="480" height="500" rx="12" fill="#f6f5f1"/>
  <g font-family="system-ui, sans-serif" font-size="24" fill="#202522">
    <text x="24" y="40">Project time (seconds)</text>
    <path d="M40 108V432m100-324V432m100-324V432m100-324V432m100-324V432" stroke="#a6aea8" stroke-dasharray="5 6"/>
    <rect x="40" y="78" width="400" height="32" rx="4" fill="#a6c9b0"/>
    <circle cx="40" cy="94" r="5" fill="#202522"/><circle cx="440" cy="94" r="6" fill="#f6f5f1" stroke="#202522" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="40" y="149">2</text><text x="140" y="149">3</text><text x="240" y="149">4</text><text x="340" y="149">5</text><text x="440" y="149">6</text>
    </g>
    <text x="24" y="208">Layer-local time (seconds)</text>
    <path d="M40 243h400" stroke="#556673" stroke-width="3"/>
    <g text-anchor="middle">
      <text x="40" y="285">0</text><text x="140" y="285">1</text><text x="240" y="285">2</text><text x="340" y="285">3</text><text x="440" y="285">4</text>
    </g>
    <text x="24" y="343">Video source time (seconds)</text>
    <path d="M40 378h400" stroke="#556673" stroke-width="3"/>
    <g text-anchor="middle">
      <text x="40" y="420">10</text><text x="140" y="420">10.5</text><text x="240" y="420">11</text><text x="340" y="420">11.5</text><text x="440" y="420">12</text>
    </g>
    <text x="24" y="475">○ End excluded from activity</text>
  </g>
</svg>
