<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">A transition occupies the overlap of sibling layers</title>
  <desc id="desc">Outgoing layer A runs from composition second 0 to 2. Incoming layer B runs from 1 to 3. The transition spans their overlap from 1 to 2, with normalized progress zero at 1, one half at 1.5, and one at 2.</desc>
  <style>
    :root { --bg:#f0f2f4; --panel:#e1e6eb; --ink:#242b33; --muted:#4e5d6a; --line:#697988; --shape:#7194b3; --edge:#3e607e; --stripe:#466c8c; }
    @media (prefers-color-scheme:dark) { :root { --bg:#292e35; --panel:#353e48; --ink:#eef2f6; --muted:#bdc9d3; --line:#95a7b6; --shape:#83a5c2; --edge:#bdd0e0; --stripe:#4b6e8d; } }
    text { fill:var(--ink); font:22px system-ui,sans-serif; }
    .small { font-size:21px; }
    .muted { fill:var(--muted); }
    .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
    .shape { fill:var(--shape); stroke:var(--edge); stroke-width:2; }
    .line { fill:none; stroke:var(--line); stroke-width:2; }
    .guide { fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:4 5; }
    .arrow { fill:none; stroke:var(--line); stroke-width:2; marker-end:url(#arrow); }
    .point { fill:var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="480" height="320" rx="10" fill="var(--bg)"/>
  <text x="20" y="32">Sibling layers share one clock</text>
  <path d="M160 76v182M256 76v182M352 76v182M448 76v182" class="guide"/>
  <text x="160" y="69" class="small" text-anchor="middle">0 s</text>
  <text x="256" y="69" class="small" text-anchor="middle">1 s</text>
  <text x="352" y="69" class="small" text-anchor="middle">2 s</text>
  <text x="448" y="69" class="small" text-anchor="middle">3 s</text>
  <text x="20" y="111" class="small">Outgoing A</text>
  <rect x="160" y="85" width="192" height="38" class="shape" rx="4"/>
  <text x="20" y="169" class="small">Incoming B</text>
  <rect x="256" y="143" width="192" height="38" class="shape" rx="4" opacity="0.6"/>
  <text x="20" y="227" class="small">Transition</text>
  <rect x="256" y="201" width="96" height="38" class="panel" rx="4"/>
  <text x="256" y="266" class="small" text-anchor="middle">0</text>
  <text x="304" y="266" class="small" text-anchor="middle">0.5</text>
  <text x="352" y="266" class="small" text-anchor="middle">1</text>
  <text x="20" y="303" class="small muted">At 1.5 s, transition progress = 0.5</text>
</svg>
