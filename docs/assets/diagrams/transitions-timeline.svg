<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="title desc">
<title id="title">A transition fits within two sibling layers</title>
<desc id="desc">The root composition owns outgoing scene A from zero to two seconds and incoming scene B from one to three seconds. The transition occupies their full overlap from one to two seconds. Local time 1, 1.5 and 2 seconds maps to transition progress zero, one half and one.</desc>
<rect width="480" height="400" rx="12" fill="#f5f7f5"/>
<g font-family="system-ui,sans-serif" font-size="21" fill="#172b32">
<text x="20" y="36">Owner: project.root composition</text>
<g stroke="#a3b4b0" stroke-width="1" stroke-dasharray="4 5"><path d="M150 80v210M250 80v210M350 80v210M450 80v210"/></g>
<g text-anchor="middle"><text x="150" y="76">0 s</text><text x="250" y="76">1 s</text><text x="350" y="76">2 s</text><text x="450" y="76">3 s</text></g>
<text x="20" y="128">Outgoing A</text><rect x="150" y="100" width="200" height="44" rx="6" fill="#c6e2d4" stroke="#426f61"/>
<text x="20" y="188">Incoming B</text><rect x="250" y="160" width="200" height="44" rx="6" fill="#e8d9cc" stroke="#886148"/>
<text x="20" y="248">Transition</text><rect x="250" y="220" width="100" height="44" rx="6" fill="#d7ddeb" stroke="#596b92"/>
<path d="M250 290h100m-10-7 10 7-10 7" fill="none" stroke="#596b92" stroke-width="3"/>
<g text-anchor="middle"><text x="250" y="327">0</text><text x="300" y="327">0.5</text><text x="350" y="327">1</text><text x="300" y="370">Normalized progress</text></g>
</g></svg>
