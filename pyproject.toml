[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "vestra"
dynamic = ["version"]
description = "Native video composition and rendering engine with Python authoring and a Rust core"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
keywords = ["video editing", "video rendering", "ffmpeg"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/evgen2571/vestra"
Documentation = "https://github.com/evgen2571/vestra/tree/main/docs"
Repository = "https://github.com/evgen2571/vestra"
Issues = "https://github.com/evgen2571/vestra/issues"

[project.optional-dependencies]
test = ["jsonschema==4.26.0", "mypy>=1.13", "pytest>=8"]
dev = ["jsonschema==4.26.0", "maturin>=1.14,<2", "mypy>=1.13", "pytest>=8", "ruff>=0.12,<0.13"]

benchmark = ["moviepy==2.2.1", "psutil==7.2.2", "pillow==11.3.0", "imageio-ffmpeg==0.6.0", "maturin==1.14.1"]

[tool.ruff]
target-version = "py311"

[tool.uv]
# Isolated source builds must use the same build backend as uv.lock.
build-constraint-dependencies = ["maturin==1.14.1"]

[tool.ruff.lint]
extend-ignore = ["E701", "E702"]

[tool.maturin]
manifest-path = "crates/vestra-python/Cargo.toml"
module-name = "vestra._native"
python-source = "python"
python-packages = ["vestra"]
include = [
  { path = "vendor/ffmpeg-sys-next/**/*", format = "sdist" },
  { path = "scripts/effects/schema.rs", format = "sdist" },
  { path = "tests/render_effect_cases.rs", format = "sdist" },
  { path = "schemas/project.schema.json", format = "sdist" },
  { path = "THIRD_PARTY_NOTICES.md", format = "wheel" },
  { path = "THIRD_PARTY_NOTICES.md", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["python-tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "python"
exclude = ["python-tests/typing_failures/"]
