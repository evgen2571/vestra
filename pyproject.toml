[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "vestra"
version = "0.1.0"
description = "Python SDK with typed project authoring and immutable native rendering APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = ["mypy>=1.13", "pytest>=8"]

[tool.maturin]
manifest-path = "crates/vestra-python/Cargo.toml"
module-name = "vestra._native"
python-source = "python"
python-packages = ["vestra"]

[tool.pytest.ini_options]
testpaths = ["python-tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "python"
exclude = ["python-tests/typing_failures/"]
